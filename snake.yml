name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Ushan2001
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_dots=#2d3343,#0e4429,#006d32,#26a641,#39d353&color_snake=#00D9FF
            dist/snake-light.svg?color_dots=#F5F7FA,#9be9a8,#40c463,#30a14e,#216e39&color_snake=#0891B2

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
